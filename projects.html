---
layout: default
title: 项目
home: true
permalink: /projects/
---
<main class="writing" id="writing">
  <div class="writing__head">
    <h2 class="writing__heading reveal">项目</h2>
    <a class="writing__nav" href="/#writing">文章 →</a>
  </div>

  <div class="writing__inner">
{% for project in site.data.projects %}
    <a class="card reveal" href="{{ project.url }}" target="_blank" rel="noopener">
      <div class="card__top">
        <span class="card__tag">项目</span>
        <span class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m-6-6 6 6-6 6"/></svg>
        </span>
      </div>
      <h3 class="card__title">{{ project.name }}</h3>
      <p class="card__desc">{{ project.description }}</p>
    </a>
{% endfor %}

    <footer class="footer">
      <p>© 2026 A5K · 托管于 GitHub Pages</p>
    </footer>
  </div>
</main>
