---
<!DOCTYPE html>
<html lang="zh-CN"{% if page.home %} class="home"{% endif %}>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0a1430">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: '/assets/og-cover.jpg' | absolute_url }}">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta property="og:locale" content="zh_CN">
<link rel="icon" href="{{ '/assets/icon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
<script>document.documentElement.className += ' js';</script>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body{% if page.home %} class="home"{% endif %}>

{{ content }}

<script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
